name: daily
on:
  # Started at 07:00 Edmonton (13:01 UTC in MDT, 14:01 UTC in MST) by the spike worker's
  # scheduler (spike-worker/src/dispatch.ts): GitHub's own cron ran this 4-7 hours late. No cron
  # here, so the digest isn't sent twice. If a schedule is ever added back, the "season" step
  # keeps only the 13:00 or 14:00 UTC one matching Edmonton's offset.
  workflow_dispatch:

jobs:
  daily:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      CRYPTOPANIC_TOKEN: ${{ secrets.CRYPTOPANIC_TOKEN }}
      NEWSAPI_KEY: ${{ secrets.NEWSAPI_KEY }}
      COINMARKETCAL_KEY: ${{ secrets.COINMARKETCAL_KEY }}
    steps:
      - name: season
        id: season
        run: |
          zone=$(TZ=America/Edmonton date +%Z)
          want="0 13 * * *"; [ "$zone" = "MST" ] && want="0 14 * * *"
          if [ "${{ github.event_name }}" != "schedule" ] || [ "${{ github.event.schedule }}" = "$want" ]; then
            echo "run=true" >> $GITHUB_OUTPUT
          else
            echo "run=false" >> $GITHUB_OUTPUT; echo "Edmonton is on $zone: the '$want' cron runs the digest, skipping this one"
          fi
      - if: steps.season.outputs.run == 'true'
        uses: actions/checkout@v4
      - if: steps.season.outputs.run == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - if: steps.season.outputs.run == 'true'
        run: pip install -r requirements.txt
      - name: grade alerts + scoreboard
        if: steps.season.outputs.run == 'true'
        run: python -m scanner.outcomes
      - name: catalysts + footprints + digest
        if: steps.season.outputs.run == 'true'
        run: python -m scanner.digest
