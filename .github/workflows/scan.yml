name: scan
on:
  schedule:
    - cron: "*/5 * * * *"      # every 5 min (GitHub may delay a few minutes under load)
  workflow_dispatch:
    inputs:
      stage:
        description: "all, or a comma-separated mix of a, b, l (listings)"
        default: "all"

concurrency:
  group: scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      UPBIT_RELAY_URL: ${{ secrets.UPBIT_RELAY_URL }}       # spike worker /upbit-notices (Upbit blocks Actions IPs)
      UPBIT_RELAY_TOKEN: ${{ secrets.UPBIT_RELAY_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      # Listings every 5 min. Stage B + exits every 15 min. Stage A (daily bars) in the first
      # 15 min of each hour: up to 3 runs, which is harmless (in_play dedupes) and survives a
      # delayed or dropped scheduled run.
      - name: decide stage
        id: st
        run: |
          m=$((10#$(date -u +%M)))
          if [ -n "${{ github.event.inputs.stage }}" ]; then echo "stage=${{ github.event.inputs.stage }}" >> $GITHUB_OUTPUT
          elif [ $m -lt 15 ]; then echo "stage=all" >> $GITHUB_OUTPUT
          elif [ $((m % 15)) -lt 5 ]; then echo "stage=b,l" >> $GITHUB_OUTPUT
          else echo "stage=l" >> $GITHUB_OUTPUT; fi
      - run: python -m scanner.scan --stage ${{ steps.st.outputs.stage }}
