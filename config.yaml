# Momentum scanner configuration.
# Everything tunable lives here; the code reads this file at startup.

account:
  capital_usd: 300           # trading bankroll (NOT the long-term portfolio)
  risk_per_trade_pct: 5      # a stop-out costs this % of capital
  max_position_pct: 50       # never put more than this % of capital in one trade
  max_concurrent_trades: 2   # open positions at once; further setups are logged as skipped_concurrent (null = no limit)
  fees_pct: 0.3              # per side, % of notional; used for $ P&L in backtests

universe:
  crypto:
    enabled: true
    exchange: kraken         # ccxt exchange id; kraken is Canada-friendly and needs no API key for public data
    quote: USD
    top_n_by_volume: 30      # scan the N most liquid pairs
    exclude: [USDT, USDC, DAI, TUSD, PYUSD, EUR, GBP, CAD, AUD, JPY, CHF]   # stablecoins / fiat pairs
    # Stage A also scans Coinbase USD pairs that are running hard, even if they're outside
    # the Kraken top-N. These are scanned (Stage A/B, exits, grading) on Coinbase data.
    coinbase_movers:
      enabled: true
      min_gain_pct: 20         # close-to-close gain over the window, on closed daily bars
      max_gain_pct: 60         # above this it's a blow-off, not a breakout: skip
      gain_window_days: 3
      min_volume_usd: 5000000  # Coinbase 24h quote volume
      # Shadow: their alerts are sent (marked SHADOW) and graded, but stored as not taken, so
      # they never use a trade slot. The 90-day eval (data/movers_eval_widened.md) showed no edge
      # and the extra trades crowded out Kraken winners. Set false to trade them.
      shadow: true
  stocks:
    enabled: false           # flip on in week 2
    tickers_file: data/stock_universe.txt

timeframes:
  daily: 1d
  intraday: 1h              # used for pullback watch; 15m in the workflow schedule is scan frequency, not bar size

# Entry types. Both are graded separately; remove one to disable it.
#   pullback: wait for Stage B (controlled pullback on hourly bars)
#   breakout: buy the close of the Stage A breakout day
entries: [breakout, pullback]

# Stage A — breakout detection (daily bars)
breakout:
  lookback_high_days: 20
  volume_multiple: 3.0       # today's volume >= this x 30-day average
  volume_avg_days: 30
  min_impulse_pct:           # % gain over the impulse window
    crypto: 25
    stocks: 12
  impulse_window_days: 3
  in_play_expiry_days: 5     # drop if no setup within N days of breakout

# Stage A, intraday: checked on the hourly run, on 1h bars. No buy alert: a hit goes in play
# (source "intraday") and Stage B watches it for a pullback under the normal rules. A daily
# breakout on the same coin takes the row over (daily levels, breakout entry as usual).
intraday_breakout:
  enabled: true
  lookback_high_hours: 72    # 1h close above the prior 3-day high
  volume_multiple: 3.0       # 1h volume >= this x the prior 3-day hourly average
  volume_avg_hours: 72
  min_gain_pct: 15           # close vs the close gain_window_hours earlier
  gain_window_hours: 24

# Breakout entry (fires on the Stage A bar)
breakout_entry:
  stop_buffer_pct: 3.0       # stop = breakout_level x (1 - this/100)
  t1_multiple: 1.0           # T1 = entry + this x (entry - impulse_low); take half
  t2_multiple: 2.0           # T2 = entry + this x (entry - impulse_low)
  min_reward_risk: 2.0       # R:R to T2
  # A breakout first seen too late (or after price ran away) gets no breakout entry:
  # it goes in play as "late", Stage B still watches it for a pullback entry.
  max_alert_delay_hours: 4   # hours after the breakout bar closed
  max_chase_pct: 5           # current price above the breakout close

# Stage B — pullback setup (intraday bars)
pullback:
  min_retrace: 0.25          # fraction of impulse range
  max_retrace: 0.55          # beyond this the move is considered failed
  ema_period: 20
  require_ema_rising: true
  require_close_above_ema: true
  pullback_volume_ratio_max: 0.8   # avg pullback volume / avg impulse volume must be below this
  min_reward_risk: 2.0

# Stage C — targets
targets:
  t1: impulse_high           # take half off
  t2_extension: 0.5          # impulse_high + this x impulse_range
  stop_buffer_pct: 1.0       # stop sits this % below pullback low

# Backtest history source. Kraken's OHLC endpoint only serves the latest 720 bars
# (30 days of 1h), so a year of hourly history comes from here. Public, no key.
backtest:
  history_exchange: coinbase

# Exchange-listing watcher (module 1, scanner/listings.py), polled every 5 minutes
listings:
  sources: [upbit, bithumb, binance, coinbase]
  max_age_hours: 6           # older than this when first seen: stored only (no Telegram, not put in play)
  dedupe_days: 7             # same exchange + coin within this window is one listing
  down_after_failures: 3     # Telegram "source down" after this many failed runs in a row (once), "recovered" once after
  exclude: [EURC, USD1, RLUSD, USDE, FDUSD, USDG, JPYC]   # stablecoin listings, on top of universe.crypto.exclude

# Footprint screener (module 2)
footprints:
  volume_multiple: 3.0
  max_abs_move_pct: 5        # "quiet" accumulation: big volume, small move
  oi_change_pct_min: 15      # open-interest change with flat price (crypto futures only)

# Catalyst calendar (module 1)
catalysts:
  lookahead_days: 14

alerts:
  channel: telegram          # telegram | email | none
  digest_hour_local: 7
  timezone: America/Edmonton
